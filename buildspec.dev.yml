version: 0.2
phases:
  pre_build:
    commands:
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_URI
  build:
    commands:
      - echo "Building Docker image..."
      - docker build --build-arg DATABASE_URL="$DATABASE_URL" -t $IMAGE_REPO_NAME .

      - echo "Tagging image..."
      - docker tag $IMAGE_REPO_NAME:$IMAGES_TAGS $ECR_URI/$IMAGE_REPO_NAME:$IMAGES_TAGS
  post_build:
    commands:
      - echo "Pushing image..."
      - docker push $ECR_URI/$IMAGE_REPO_NAME:$IMAGES_TAGS
      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"nestjs-api","imageUri":"%s"}]' "$ECR_URI:$IMAGES_TAGS" > imagedefinitions.json
artifacts:
  files:
    - imagedefinitions.json