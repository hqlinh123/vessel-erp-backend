version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - node -v
      - npm -v
      # install yarn + nest globally
      - npm i -g yarn
      - npm i -g @nestjs/cli
  build:
    commands:
      - yarn install
      - yarn build

artifacts:
  files:
    - '**/*'