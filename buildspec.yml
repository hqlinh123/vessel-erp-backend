version: 0.2
env:
  variables:
    NODE_ENV: "development"
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies for $NODE_ENV"
      - npm i -g yarn
      - npm i -g @nestjs/cli
      - yarn
      - yarn add -D @types/jest
  pre_build:
    commands:
      - echo "Creating real .env for runtime..."
      - echo "JWT_SECRET=${JWT_SECRET}" >> .env
      - echo "NODE_ENV=${NODE_ENV}" >> .env
      - echo "Creating .env file from CodePipeline variables"
      - echo "NODE_ENV=$NODE_ENV" > .env
      - echo "DB_PORT=$DB_PORT" >> .env
      - echo "DB_HOST=$DB_HOST" >> .env
      - echo "DB_PASSWORD=$DB_PASSWORD" >> .env
      - echo "JWT_SECRET=$JWT_SECRET" >> .env
      - echo "REDIS_PASSWORD=$REDIS_PASSWORD" >> .env
      # Debug: kiểm tra file .env (ẩn mật khẩu)
      - echo "Environment file created:"
      - cat .env | sed 's/PASSWORD=.*/PASSWORD=***/' | sed 's/SECRET=.*/SECRET=***/'
      - export DATABASE_URL="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:-5432}/${DB_NAME}?schema=public"
      - echo "Generating Prisma Client..."
      - echo "Running lint and tests..."
      - yarn lint || true  # Không fail nếu chưa có lint
      - yarn prisma generate
  build:
    commands:
      - echo "Building NestJS application"
      - yarn build
  post_build:
    commands:
      - echo "Running database migrations (if needed)..."
      - npx prisma migrate deploy  # Chạy migration ở runtime
      - echo "Seeding database (optional)..."
      - yarn seed || echo "Seed skipped or failed"

artifacts:
  files:
    - '**/*'
    - '.env'
    - '!node_modules/.cache/**'