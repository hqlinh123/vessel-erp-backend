version: 0.3
env:
  variables:
    NODE_ENV: development
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g yarn
      - yarn
  pre_build:
    commands:
      - echo "NODE_ENV=${NODE_ENV}" > .env
      - echo "DATABASE_URL=${DATABASE_URL}" >> .env
      - yarn prisma generate
  build:
    commands:
      - echo "Building application..."
      - yarn build
      - echo "Creating deployment package..."
      - mkdir -p deploy_bundle
      - cp -r dist deploy_bundle/
      - cp -r node_modules deploy_bundle/
      - cp -r prisma deploy_bundle/
      - cp package.json deploy_bundle/
      - cp yarn.lock deploy_bundle/
      - cp .env deploy_bundle/
      - cd deploy_bundle
      - zip -r ../deploy.zip .
      - cd ..
artifacts:
  files:
    - deploy.zip
  discard-paths: yes