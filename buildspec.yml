version: 0.2
env:
  variables:
    NODE_ENV: development
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g yarn
      - yarn install
  pre_build:
    commands:
      - echo "NODE_ENV=${NODE_ENV}" > .env
      - echo "DATABASE_URL=${DATABASE_URL}" >> .env
      - yarn prisma generate
  build:
    commands:
      - yarn build
artifacts:
  files:
    - '**/*'