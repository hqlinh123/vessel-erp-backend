version: 0.2
env:
  variables:
    NODE_ENV: development
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g yarn
      - yarn
pre_build:
  commands:
    - echo "Using environment: ${NODE_ENV}"
    - cp .env.${NODE_ENV} .env
    - echo "DATABASE_URL=${DATABASE_URL}" >> .env
    - yarn prisma generate
  build:
    commands:
      - echo "Building application..."
      - yarn build
      - echo "Creating deployment package..."
      - mkdir -p deploy_bundle
      - cp -r dist deploy_bundle/
      - cp -r node_modules deploy_bundle/
      - cp -r prisma deploy_bundle/
      - cp package.json deploy_bundle/
      - cp yarn.lock deploy_bundle/
      - cp .env deploy_bundle/
      - |
        printf "web: node dist/src/main.js\n" > deploy_bundle/Procfile
      - cd deploy_bundle
      - zip -r ../deploy.zip .
      - cd ..
      - echo "End deployment package..."
      # - echo "Complete deployment package..."
artifacts:
  files:
    - '**/*'
  base-directory: deploy_bundle
  discard-paths: no