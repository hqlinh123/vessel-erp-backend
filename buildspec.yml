version: 0.2
env:
  variables:
    NODE_ENV: development
phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - npm install -g yarn
      - yarn
pre_build:
  commands:
    - echo "Using environment: ${NODE_ENV}"
    - cp .env.${NODE_ENV} .env
    - echo "DATABASE_URL=${DATABASE_URL}" >> .env
    - yarn prisma generate
    - yarn prisma migrate deploy 
  build:
    commands:
      - echo "Building NestJS..."
      - yarn build

      - echo "Preparing Elastic Beanstalk bundle..."
      - mkdir -p deploy_bundle

      - cp -r dist deploy_bundle/
      - cp -r prisma deploy_bundle/
      - cp package.json deploy_bundle/
      - cp yarn.lock deploy_bundle/
      - cp .env deploy_bundle/
      - |
        printf "web: node dist/src/main.js\n" > deploy_bundle/Procfile
      # Debug (remove later)
      - echo "=== DIST ==="
      - find dist -type f | grep main

      - echo "=== DEPLOY BUNDLE ==="
      - find deploy_bundle -type f | grep main
      # - cd deploy_bundle
      # - zip -r ../deploy.zip .
      # - cd ..
artifacts:
  files:
    - '**/*'
  base-directory: deploy_bundle
  discard-paths: no